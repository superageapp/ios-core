name: Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional SemVer version without a leading v, for example 0.1.0. Leave empty to use the latest dated changelog section.
        required: false
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate release readiness
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error title=Wrong branch::Run releases from the main branch."
            exit 1
          fi

          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            version="$(
              awk '
                /^## [0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)? - [0-9]{4}-[0-9]{2}-[0-9]{2}$/ {
                  value = $2
                  print value
                  exit
                }
              ' CHANGELOG.md
            )"
          fi

          if [[ -z "$version" ]]; then
            echo "::error title=Missing release version::CHANGELOG.md must contain a dated SemVer section like '## 0.1.0 - 2026-06-06'."
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid version::Use SemVer without a leading v, for example 0.1.0."
            exit 1
          fi

          tag="v${version}"
          escaped_version="$(printf '%s' "$version" | sed 's/[][\\.^$*+?{}()|]/\\&/g')"

          if ! grep -Eq "^## ${escaped_version} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error title=Missing changelog section::CHANGELOG.md must contain '## ${version} - YYYY-MM-DD'."
            exit 1
          fi

          skip="false"
          tag_lookup_status=0
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null || tag_lookup_status=$?
          if [[ "$tag_lookup_status" -eq 0 ]]; then
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error title=Tag already exists::${tag} already exists on origin."
              exit 1
            fi
            echo "::notice title=Nothing to release::${tag} already exists on origin; skipping publish until CHANGELOG.md gains a new dated section."
            skip="true"
          elif [[ "$tag_lookup_status" -ne 2 ]]; then
            echo "::error title=Tag lookup failed::git ls-remote exited with status ${tag_lookup_status}."
            exit 1
          fi

          if [[ "$skip" == "false" ]] && ! grep -Fq "version = \"${version}\"" Sources/SuperAgeCore/SuperAgeCore.swift; then
            echo "::error title=Version constant mismatch::SuperAgeCoreInfo.version must equal \"${version}\" before releasing."
            exit 1
          fi

          prerelease="false"
          if [[ "$version" == *-* ]]; then
            prerelease="true"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_PRERELEASE" == "true" ]]; then
            prerelease="true"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        if: steps.release.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"

          awk -v version="$version" '
            index($0, "## " version " - ") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -Eq '[^[:space:]]' release-notes.md; then
            echo "::error title=Empty release notes::No release notes found for ${version}."
            exit 1
          fi

  test:
    name: Release checks Swift ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: github.event_name != 'pull_request' && needs.validate.outputs.skip != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.validate.outputs.version }}"

          awk -v version="$version" '
            index($0, "## " version " - ") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -Eq '[^[:space:]]' release-notes.md; then
            echo "::error title=Empty release notes::No release notes found for ${version}."
            exit 1
          fi

      - name: Create annotated tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ needs.validate.outputs.tag }}"
          version="${{ needs.validate.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "SuperAgeCore ${version}"
          git push origin "$tag"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            release create "${{ needs.validate.outputs.tag }}"
            --title "SuperAgeCore ${{ needs.validate.outputs.version }}"
            --notes-file release-notes.md
          )

          if [[ "${{ needs.validate.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
