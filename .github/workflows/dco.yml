name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Commit signoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check DCO signoff
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

          commits="$(git rev-list --no-merges "$range")"

          while IFS= read -r commit; do
            [[ -n "$commit" ]] || continue
            if ! git log -1 --format=%B "$commit" | grep -Eiq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error title=Missing DCO signoff::Commit $commit is missing a Signed-off-by trailer."
              missing=1
            fi
          done <<< "$commits"

          if [[ "$missing" -ne 0 ]]; then
            echo "Every commit must include a Signed-off-by: Name <email> trailer."
            exit 1
          fi
